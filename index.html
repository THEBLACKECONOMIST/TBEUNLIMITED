  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-weight: 400;\n  font-display: swap;\n  src: url(\"3e97406e-1c90-4f99-9e04-806a86c5d0b4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cc9f6f56-3fb4-4968-980d-f025f7ed3ce9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b4866445-d6f1-443f-8a55-34924447e741\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e0b81aa5-c28f-4859-8274-a3c748a0796b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"912b2e2a-0ad6-4859-a059-c69012d04453\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"cb88af94-89cc-4f25-b949-bbf62a4af30f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"73894160-a01d-42e8-9a05-71c3022e3066\"><\u002Fscript>\n<script src=\"2376bbb6-ad48-43c3-8c75-a2aab47eb3c5\"><\u002Fscript>\n<style>\nbody { margin: 0; text-wrap: pretty; }\na { color: var(--color-accent-700); text-decoration: none; }\na:hover { color: var(--color-accent-300); text-decoration: underline; }\n.corner { position: absolute; width: 15px; height: 15px; color: color-mix(in srgb, var(--color-text) 55%, transparent); pointer-events: none; }\n.corner::before { content: \"\"; position: absolute; left: 7px; top: 0; width: 1px; height: 100%; background: currentColor; }\n.corner::after { content: \"\"; position: absolute; top: 7px; left: 0; width: 100%; height: 1px; background: currentColor; }\n.corner.tl { top: -8px; left: -8px; } .corner.tr { top: -8px; right: -8px; }\n.corner.bl { bottom: -8px; left: -8px; } .corner.br { bottom: -8px; right: -8px; }\n.formula-field { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;\n  display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; opacity: 0.16; }\n.formula-field span { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; color: var(--color-accent-300);\n  font-size: 13px; white-space: nowrap; padding: 6vh 1vw; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--color-text:#f5f5f8; --color-divider:color-mix(in srgb, #f5f5f8 18%, transparent); --color-surface:#16202b; --color-accent-700:#94bce3; --gold:#c9a44c; background:#0a0e14; color:#f5f5f8; position:relative; min-height:100vh\">\n\n  <div class=\"formula-field\" aria-hidden=\"true\">\n    <span style=\"transform:rotate(-4deg)\">GDP = C + I + G + (X−M)<\u002Fspan>\n    <span style=\"transform:rotate(3deg)\">E<sub>d<\u002Fsub> = %ΔQ<sub>d<\u002Fsub> / %ΔP<\u002Fspan>\n    <span style=\"transform:rotate(-2deg)\">MV = PQ<\u002Fspan>\n    <span style=\"transform:rotate(5deg)\">π = (CPI₁ − CPI₀) / CPI₀<\u002Fspan>\n    <span style=\"transform:rotate(-3deg)\">NPV = Σ CF<sub>t<\u002Fsub> / (1+r)<sup>t<\u002Fsup><\u002Fspan>\n    <span style=\"transform:rotate(2deg)\">Q<sub>d<\u002Fsub> = a − bP<\u002Fspan>\n    <span style=\"transform:rotate(-5deg)\">ROI = (Gain − Cost) / Cost<\u002Fspan>\n    <span style=\"transform:rotate(4deg)\">U(x,y) = x<sup>α<\u002Fsup>y<sup>1−α<\u002Fsup><\u002Fspan>\n    <span style=\"transform:rotate(-2deg)\">CAGR = (V<sub>f<\u002Fsub>/V<sub>i<\u002Fsub>)<sup>1/t<\u002Fsup> − 1<\u002Fspan>\n    <span style=\"transform:rotate(3deg)\">AD = C + I + G + NX<\u002Fspan>\n    <span style=\"transform:rotate(-4deg)\">r = ρ + β(r<sub>m<\u002Fsub> − ρ)<\u002Fspan>\n    <span style=\"transform:rotate(5deg)\">ΔGDP/GDP × 100<\u002Fspan>\n    <span style=\"transform:rotate(-3deg)\">P = f(S,D)<\u002Fspan>\n    <span style=\"transform:rotate(2deg)\">EV = Σ P(x)·x<\u002Fspan>\n    <span style=\"transform:rotate(-5deg)\">IS: Y = C(Y−T)+I(r)+G<\u002Fspan>\n    <span style=\"transform:rotate(4deg)\">WACC = (E/V)Re + (D/V)Rd<\u002Fspan>\n    <span style=\"transform:rotate(-2deg)\">CPI = (Basket<sub>t<\u002Fsub>/Basket<sub>0<\u002Fsub>)×100<\u002Fspan>\n    <span style=\"transform:rotate(3deg)\">u = 1 − L/L<sub>f<\u002Fsub><\u002Fspan>\n    <span style=\"transform:rotate(-4deg)\">σ² = Σ(x−μ)²/n<\u002Fspan>\n    <span style=\"transform:rotate(5deg)\">B = ∫ MB · dQ<\u002Fspan>\n    <span style=\"transform:rotate(-3deg)\">Y = A·K<sup>α<\u002Fsup>L<sup>1−α<\u002Fsup><\u002Fspan>\n    <span style=\"transform:rotate(2deg)\">FV = PV(1+i)<sup>n<\u002Fsup><\u002Fspan>\n    <span style=\"transform:rotate(-5deg)\">S = f(P, w)<\u002Fspan>\n    <span style=\"transform:rotate(4deg)\">M1 × V = P × Q<\u002Fspan>\n  <\u002Fdiv>\n\n  <nav class=\"nav\" style=\"padding-inline:max(24px,calc((100% - 1200px)/2 + 24px));position:sticky;top:0;background:#0a0e14;z-index:10;border-bottom:1px solid var(--color-divider);flex-wrap:wrap;row-gap:8px\">\n    <span class=\"nav-brand\" style=\"display:flex;flex-direction:column;line-height:1.05\">The Black Economist<span style=\"font-family:var(--font-body);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold)\">TBE Unlimited<\u002Fspan><\u002Fspan>\n    <a href=\"#about\">About<\u002Fa>\n    <a href=\"#services\">Services<\u002Fa>\n    <a href=\"#events\">Events<\u002Fa>\n    <a href=\"#contact\">Contact<\u002Fa>\n    <a class=\"btn btn-primary\" href=\"https://calendar.app.google/1uAfZHayyqXcxtw88\">Book a Consultation<\u002Fa>\n  <\u002Fnav>\n\n  <section style=\"position:relative;z-index:1;padding:14px 0;border-bottom:1px solid var(--color-divider);background:color-mix(in srgb, #0a0e14 88%, var(--color-accent-800))\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);display:flex;gap:32px;flex-wrap:wrap;align-items:baseline\">\n      <span style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300)\">Live Markets<\u002Fspan>\n      <div style=\"display:flex;align-items:baseline;gap:10px\">\n        <span style=\"font-family:var(--font-heading);font-weight:700;letter-spacing:.04em;font-size:14px\">BTC<\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-weight:700;font-size:20px;font-feature-settings:'tnum' 1\">{{ btcPriceLabel }}<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:{{ btcChangeColor }}\">{{ btcChangeLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:10px\">\n        <span style=\"font-family:var(--font-heading);font-weight:700;letter-spacing:.04em;font-size:14px\">XRP<\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-weight:700;font-size:20px;font-feature-settings:'tnum' 1\">{{ xrpPriceLabel }}<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:{{ xrpChangeColor }}\">{{ xrpChangeLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;color:color-mix(in srgb, #f5f5f8 60%, transparent);margin-left:auto\">Updated {{ updatedLabel }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px)\">\n\n    <section style=\"padding:96px 0 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center\">\n      <div>\n        <span class=\"kicker\" style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 12px\">The Black Economist<\u002Fspan>\n        <h1 style=\"font-family:var(--font-heading);font-weight:700;font-size:clamp(44px,6vw,84px);line-height:1.04;letter-spacing:.01em;text-transform:uppercase;margin:0\">\n          <span style=\"display:block\">Move your business<\u002Fspan>\n          <span style=\"display:block\">to the black.<\u002Fspan>\n        <\u002Fh1>\n        <p style=\"font-family:var(--font-heading);font-weight:700;font-size:clamp(18px,2vw,24px);line-height:1.3;letter-spacing:.02em;color:var(--gold);margin:20px 0 0;max-width:34ch\">Analyzing global economics to create opportunities to move to the black.<\u002Fp>\n        <p style=\"font-size:17px;line-height:1.6;max-width:56ch;color:var(--color-text);margin:20px 0 0\">\n          Macro-economic insight, behavioral analysis and rigorous accounting — fused into one growth engine for minority-owned businesses ready to compete on a global scale. No jargon. No guesswork. Just the numbers, and a plan.\n        <\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:32px\">\n          <a class=\"btn btn-primary\" href=\"https://calendar.app.google/1uAfZHayyqXcxtw88\">Book a Consultation<\u002Fa>\n          <a class=\"btn btn-ghost\" href=\"#services\">See the services<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:24px;margin-top:32px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:color-mix(in srgb, #f5f5f8 70%, transparent)\">\n          <a href=\"https://instagram.com/theblackeconomist\" target=\"_blank\" rel=\"noopener\">Instagram @theblackeconomist<\u002Fa>\n          <a href=\"https://facebook.com/theblackeconomist\" target=\"_blank\" rel=\"noopener\">Facebook — The Black Economist<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure class=\"blueprint duotone\" style=\"position:relative;border:1px solid var(--color-divider);margin:0;overflow:visible\">\n        <image-slot id=\"hero-photo\" shape=\"rect\" placeholder=\"Drop a photo of Jamar White\" src=\"6aed9fe5-b98f-4159-be7e-a8d0b5f83c7e\"><\u002Fimage-slot>\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <section id=\"about\" style=\"padding:64px 0\">\n      <span class=\"kicker\" style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 12px\">01 · Who's behind the numbers<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 32px;background:var(--color-divider)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;align-items:start\">\n        <h2 style=\"font-family:var(--font-heading);font-weight:700;font-size:32px;line-height:1.3;text-transform:uppercase;letter-spacing:.02em;margin:0\">The Black Economist<\u002Fh2>\n        <div>\n          <p style=\"font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 16px\">Professor of Economics · Business Growth Strategist · Financial Consultant<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.7;max-width:60ch;color:var(--color-text);margin:0 0 16px\">\n            The Black Economist is an educator, economist, and financial consultant, serving as a Professor of Economics at the Community College of Allegheny County — built to put macro-economic and behavioral analysis to work for the business owners who've historically been shut out of it.\n          <\u002Fp>\n          <p style=\"font-size:16px;line-height:1.7;max-width:60ch;color:color-mix(in srgb, #f5f5f8 85%, transparent);margin:0\">\n            A mathematics expert as much as an economist, The Black Economist builds the models behind every recommendation — then translates them into a plan any owner can execute Monday morning. This is economics with a mission: real strategy, for real people, moving real money to the black.\n          <\u002Fp>\n          <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n            <span class=\"tag tag-accent\">Macroeconomics<\u002Fspan>\n            <span class=\"tag tag-accent\">Behavioral Economics<\u002Fspan>\n            <span class=\"tag tag-accent\">Financial Modeling<\u002Fspan>\n            <span class=\"tag tag-outline\">Accounting<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"services\" style=\"padding:64px 0\">\n      <span class=\"kicker\" style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 12px\">02 · What we do<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 32px;background:var(--color-divider)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,3vw,40px)\">\n        <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-divider);padding:28px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0\">Accounting &amp; Bookkeeping<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;color:color-mix(in srgb, #f5f5f8 78%, transparent);margin:16px 0 0\">Clean books, filed on time, built to survive an audit. The foundation every growth plan stands on.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-divider);padding:28px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0\">Business Consulting<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;color:color-mix(in srgb, #f5f5f8 78%, transparent);margin:16px 0 0\">Pricing, cash flow, growth strategy — mapped against real market and macro conditions, not guesswork.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-divider);padding:28px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0\">Economic &amp; Behavioral Analysis<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;color:color-mix(in srgb, #f5f5f8 78%, transparent);margin:16px 0 0\">Consumer demand, pricing psychology, market timing — the same tools institutions use, sized for your business.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:48px 0 72px\">\n      <span class=\"kicker\" style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 12px\">03 · The method<\u002Fspan>\n      <hr style=\"height:1px;border:0;margin:0 0 32px;background:var(--color-divider)\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-divider)\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <header style=\"display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:1px solid var(--color-divider)\">\n          <span style=\"flex:1;min-width:16ch;padding:12px 24px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600\">The Black Economist — growth framework<\u002Fspan>\n          <span style=\"border-left:1px solid var(--color-divider);padding:12px 24px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:color-mix(in srgb, #f5f5f8 70%, transparent);white-space:nowrap\">4 stages<\u002Fspan>\n        <\u002Fheader>\n        <sc-raw-table class=\"table\" style=\"width:100%;table-layout:fixed\">\n          \n          <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"font-size:13px;padding:12px 24px 12px 24px\">No.<\u002Fsc-raw-th><sc-raw-th style=\"font-size:13px;padding:12px\">Stage<\u002Fsc-raw-th><sc-raw-th style=\"font-size:13px;padding:12px\">What happens<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"font-size:13px;font-weight:600;color:var(--color-accent-300);padding:12px 24px\">01<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase\">Diagnose<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;color:color-mix(in srgb, #f5f5f8 78%, transparent)\">Books, pricing, and cash flow audited against market and macro data.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-size:13px;font-weight:600;color:var(--color-accent-300);padding:12px 24px\">02<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase\">Model<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;color:color-mix(in srgb, #f5f5f8 78%, transparent)\">A behavioral and financial model built for your specific customers and category.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-size:13px;font-weight:600;color:var(--color-accent-300);padding:12px 24px\">03<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase\">Advise<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;color:color-mix(in srgb, #f5f5f8 78%, transparent)\">A plain-language plan: what to change, in what order, and why.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"font-size:13px;font-weight:600;color:var(--color-accent-300);padding:12px 24px\">04<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase\">Execute<\u002Fsc-raw-td><sc-raw-td style=\"font-size:15px;padding:12px;color:color-mix(in srgb, #f5f5f8 78%, transparent)\">Ongoing accounting and check-ins to keep the plan on track.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"events\" style=\"padding:48px 0 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;align-items:center\">\n      <figure class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-divider);margin:0;overflow:visible;padding:0\">\n        <img src=\"1362b0e7-4c42-42b8-be12-73bdc97750c7\" alt=\"Black Friday with The Black Economist — Friday, Oct 2, 2026\" style=\"width:100%;height:auto;display:block\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <\u002Ffigure>\n      <div>\n        <span class=\"kicker\" style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 12px\">04 · Live event<\u002Fspan>\n        <h2 style=\"font-family:var(--font-heading);font-weight:700;font-size:32px;text-transform:uppercase;letter-spacing:.02em;margin:0\">Black Friday with The Black Economist<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.7;color:color-mix(in srgb, #f5f5f8 78%, transparent);margin:16px 0 0;max-width:52ch\">\n          A live session on AI-driven consumer demand, crypto markets, and what the data really says about the next quarter — built for owners who need to plan, not just predict.\n        <\u002Fp>\n        <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n          <span class=\"tag tag-outline\">Friday, Oct 2, 2026<\u002Fspan>\n          <span class=\"tag tag-outline\">Virtual + in person<\u002Fspan>\n        <\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-primary\" style=\"margin-top:24px\">Reserve your seat<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:56px 0 72px;border-top:1px solid var(--color-divider)\">\n      <blockquote style=\"font-family:var(--font-heading);font-weight:700;font-size:clamp(24px,2.6vw,34px);line-height:1.4;max-width:38ch;margin:0;text-indent:-0.3em;color:var(--gold)\">\n        “Analyzing global economics to create opportunities — to move to the black.”\n      <\u002Fblockquote>\n      <figcaption style=\"font-size:15px;color:color-mix(in srgb, #f5f5f8 70%, transparent);margin:24px 0 0\">— The Black Economist<\u002Ffigcaption>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"padding:48px 0 72px;border-top:1px solid var(--color-divider)\">\n      <span class=\"kicker\" style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-300);margin:0 0 12px\">05 · Get started<\u002Fspan>\n      <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0\">Ready to move your business to the black?<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.6;color:color-mix(in srgb, #f5f5f8 78%, transparent);max-width:60ch;margin:12px 0 0\">Email for a free discovery call, or subscribe to The Black Economist channel for market breakdowns and strategy notes.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;align-items:stretch\">\n        <a class=\"btn btn-primary\" href=\"https://calendar.app.google/1uAfZHayyqXcxtw88\">Book a Consultation<\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"https://www.youtube.com/@theblackeconomist\" target=\"_blank\" rel=\"noopener\">Subscribe to the channel<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size:14px;color:color-mix(in srgb, #f5f5f8 70%, transparent);margin:20px 0 0\">jamar@economist.black<\u002Fp>\n    <\u002Fsection>\n\n    <footer style=\"padding:32px 0;border-top:1px solid var(--color-divider);font-size:13px;color:color-mix(in srgb, #f5f5f8 70%, transparent);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n      <span>© 2026 TBE Unlimited — The Black Economist<\u002Fspan>\n      <span style=\"display:flex;gap:16px\">\n        <a href=\"https://instagram.com/theblackeconomist\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa>\n        <a href=\"https://facebook.com/theblackeconomist\" target=\"_blank\" rel=\"noopener\">Facebook<\u002Fa>\n        <a href=\"mailto:jamar@economist.black\">jamar@economist.black<\u002Fa>\n      <\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { loading: true, error: false, btc: null, xrp: null, btcChange: null, xrpChange: null, date: null };\n\n  async componentDidMount() {\n    const todayKey = new Date().toISOString().slice(0, 10);\n    let cache = null;\n    try { cache = JSON.parse(localStorage.getItem('tbe_crypto_cache') || 'null'); } catch (e) {}\n    if (cache && cache.date === todayKey) { this.setState({ ...cache, loading: false }); return; }\n    try {\n      const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ripple&vs_currencies=usd&include_24hr_change=true');\n      const data = await res.json();\n      const next = { date: todayKey, btc: data.bitcoin.usd, btcChange: data.bitcoin.usd_24h_change, xrp: data.ripple.usd, xrpChange: data.ripple.usd_24h_change };\n      try { localStorage.setItem('tbe_crypto_cache', JSON.stringify(next)); } catch (e) {}\n      this.setState({ ...next, loading: false });\n    } catch (e) {\n      if (cache) this.setState({ ...cache, loading: false });\n      else this.setState({ loading: false, error: true });\n    }\n  }\n\n  renderVals() {\n    const fmtUSD = (n) => n == null ? '—' : '$' + n.toLocaleString('en-US', { maximumFractionDigits: n < 10 ? 4 : 2 });\n    const fmtChange = (n) => n == null ? '' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';\n    const changeColor = (n) => n == null ? '#f5f5f8' : (n >= 0 ? '#7fd8a4' : '#f28b82');\n    const s = this.state;\n    return {\n      btcPriceLabel: s.loading ? 'Loading…' : fmtUSD(s.btc),\n      xrpPriceLabel: s.loading ? 'Loading…' : fmtUSD(s.xrp),\n      btcChangeLabel: s.loading ? '' : fmtChange(s.btcChange),\n      xrpChangeLabel: s.loading ? '' : fmtChange(s.xrpChange),\n      btcChangeColor: changeColor(s.btcChange),\n      xrpChangeColor: changeColor(s.xrpChange),\n      updatedLabel: s.error ? 'unavailable' : (s.date || '—'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
